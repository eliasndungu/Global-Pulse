# ─────────────────────────────────────────────────────────────
#  Global-Pulse – Alembic configuration
# ─────────────────────────────────────────────────────────────

[alembic]
# Path to the alembic/ directory (contains env.py and versions/)
script_location = alembic

# Revision file naming convention: YYYYMMDD_HHMMrev_<slug>
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(rev)s_%%(slug)s

# sqlalchemy.url is overridden at runtime by env.py via get_db_url()
sqlalchemy.url =

# Output encoding for migration scripts
output_encoding = utf-8

# ── Logging ──────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
