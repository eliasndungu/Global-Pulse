name: CI

on:
  push:
    branches: ["main", "master", "copilot/**"]
  pull_request:
    branches: ["main", "master"]

# Minimal permissions for the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── Install runtime + test dependencies ──────────────────
      # We install the lightweight subset needed for unit tests only;
      # Airflow and Prophet require heavyweight constraints files and
      # are excluded from CI to keep build times reasonable.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi==0.111.0 \
            "uvicorn[standard]==0.29.0" \
            httpx==0.27.0 \
            requests==2.32.3 \
            feedparser==6.0.11 \
            pandas==2.2.2 \
            numpy==1.26.4 \
            "scikit-learn==1.5.0" \
            xgboost==2.0.3 \
            "passlib[bcrypt]==1.7.4" \
            "pydantic[email]==2.7.1" \
            "pydantic-settings==2.2.1" \
            python-dotenv==1.0.1 \
            "tenacity==8.3.0" \
            "structlog==24.1.0" \
            "python-jose[cryptography]==3.3.0" \
            python-multipart==0.0.9 \
            SQLAlchemy==2.0.30 \
            aiohttp==3.9.5 \
            pytest==8.2.1 \
            "pytest-asyncio==0.23.7" \
            "pytest-cov==5.0.0" \
            respx==0.21.1

      # ── Run tests with coverage ───────────────────────────────
      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          MARINETRAFFIC_API_KEY: "test"
          OPENWEATHER_API_KEY: "test"
          API_SECRET_KEY: "ci-test-secret"
          MODEL_STORE_PATH: "/tmp/model_store"
        run: |
          pytest tests/ -v \
            --cov=adapters \
            --cov=api \
            --cov=forecasting \
            --cov-report=term-missing \
            --cov-report=xml

      # ── Upload coverage ───────────────────────────────────────
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
