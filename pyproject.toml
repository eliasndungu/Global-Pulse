[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ── Project metadata ────────────────────────────────────────────
[project]
name = "global-pulse"
version = "1.0.0"
description = "Data-as-a-Service platform for global maritime shipping intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["maritime", "shipping", "DaaS", "time-series", "forecasting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime deps (also in requirements.txt for Docker/Airflow environments)
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "requests>=2.32.3",
    "feedparser>=6.0.11",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "aiohttp>=3.9.5",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1.5"]
test = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/eliasndungu/Global-Pulse"
"Bug Tracker" = "https://github.com/eliasndungu/Global-Pulse/issues"


# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"


# ── Ruff (linter + formatter) ────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in default args (FastAPI pattern)
    "B904",  # raise without from (some intentional cases)
]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "api", "db", "forecasting"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ── Mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "prophet.*", "feedparser.*", "passlib.*"]
ignore_missing_imports = true


# ── Coverage ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["adapters", "api", "forecasting"]
omit = ["tests/*", "alembic/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
